<div class="relative min-h-screen min-w-screen overflow-hidden bg-slate-50/80 dark:bg-slate-950">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(26,86,219,0.09),_transparent_42%),linear-gradient(135deg,_#f8fbff_0%,_#f5f7fb_100%)] dark:bg-[radial-gradient(circle_at_top_left,_rgba(82,123,255,0.16),_transparent_42%),linear-gradient(135deg,_#020617_0%,_#0f172a_100%)]"></div>

  <div class="relative flex items-center justify-center min-h-screen">
    <div class="flex flex-col items-center justify-center w-full max-w-2xl mx-4">
      <div class="relative w-full backdrop-blur-xl bg-white/90 dark:bg-slate-900/80 border border-slate-200/70 dark:border-slate-700/60 rounded-[1.75rem] shadow-[0_20px_80px_-32px_rgba(15,23,42,0.4)]">
        <div class="relative py-14 px-8 sm:px-14">
          
          <div class="text-center mb-8">
            <div class="relative mb-6">
              <div class="relative flex justify-center items-center bg-linear-to-r from-[#1A56DB] to-[#527BFF] rounded-full shadow-lg mx-auto" style="width: 4rem; height: 4rem">
                <i class="text-white pi pi-fw pi-key text-3xl"></i>
              </div>
            </div>
            <h1 class="font-semibold text-3xl sm:text-4xl mb-2 text-slate-900 dark:text-white">{{ appConfig.platformName() }}</h1>
            <span class="text-slate-600 dark:text-slate-300 text-lg">{{ t('auth.reset.title') }}</span>
          </div>

          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="space-y-3">
              <label for="password" class="block text-sm font-semibold text-surface-700 dark:text-surface-300">{{ t('auth.reset.new_password') }}</label>
              <p-password
                id="password"
                formControlName="password"
                [placeholder]="t('auth.reset.password_placeholder')"
                [toggleMask]="true"
                [feedback]="true"
                inputStyleClass="w-full h-12 border-2 border-surface-300 focus:border-blue-500 rounded-lg transition-colors backdrop-blur-sm bg-white/50 dark:bg-slate-800/50"
                styleClass="w-full">
              </p-password>
              <small *ngIf="password.invalid && password.touched" class="text-red-500 flex items-center gap-1">
                <i class="pi pi-exclamation-triangle"></i>
                {{ t('auth.reset.password_min') }}
              </small>
            </div>

            <div class="space-y-3">
              <label for="confirmPassword" class="block text-sm font-semibold text-surface-700 dark:text-surface-300">{{ t('auth.reset.confirm_password') }}</label>
              <p-password
                id="confirmPassword"
                formControlName="confirmPassword"
                [placeholder]="t('auth.reset.confirm_placeholder')"
                [toggleMask]="true"
                [feedback]="false"
                inputStyleClass="w-full h-12 border-2 border-surface-300 focus:border-blue-500 rounded-lg transition-colors backdrop-blur-sm bg-white/50 dark:bg-slate-800/50"
                styleClass="w-full">
              </p-password>
              <small *ngIf="resetForm.hasError('passwordMismatch') && confirmPassword.touched" class="text-red-500 flex items-center gap-1">
                <i class="pi pi-exclamation-triangle"></i>
                {{ t('auth.reset.password_mismatch') }}
              </small>
            </div>

            <button
              au-btn
              [loading]="isLoading()"
              [icon]="'pi pi-check'"
              type="submit"
              [disabled]="resetForm.invalid"
              class="w-full h-14 text-lg font-bold shadow-xl hover:shadow-2xl transform hover:scale-[1.02] transition-all duration-300"
              style="background: linear-gradient(135deg, #1A56DB 0%, #527BFF 100%); border: none;">
              {{ t('auth.reset.submit') }}
            </button>
          </form>

          <div class="flex items-center my-8">
            <div class="flex-1 h-px bg-linear-to-r from-transparent via-surface-300 to-transparent"></div>
          </div>

          <div class="text-center">
            <a routerLink="/auth/login" class="text-blue-500 hover:underline font-medium flex items-center justify-center gap-2">
              <i class="pi pi-arrow-left"></i>
              {{ t('auth.reset.back_to_login') }}
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<p-toast />
