{% extends "emails/base.html" %}
{% block content %}
<p style="margin:0 0 12px;">Hola <strong>{{ user_full_name }}</strong>,</p>
<p style="margin:0 0 12px;">Hemos recibido tu ticket de soporte y será revisado a la brevedad.</p>
<div style="background:#f3f4f6;border-radius:8px;padding:16px;margin:16px 0;font-size:14px;">
  <p style="margin:4px 0;"><strong>Asunto:</strong> {{ subject }}</p>
  <p style="margin:4px 0;"><strong>Descripción:</strong> {{ description }}</p>
  <p style="margin:4px 0;"><strong>Prioridad:</strong> {{ priority }}</p>
</div>
<p style="margin:0;">Te notificaremos cuando haya una respuesta.</p>
{% endblock %}
